<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>الممر المظلم</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#cfd8e6}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;background:#000}
#scare{display:none;z-index:15;pointer-events:none}
#touch{position:fixed;inset:0;z-index:5;touch-action:none}

#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(80,140,255,.45);background:rgba(20,40,90,.18);display:none;z-index:7;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(90,150,255,.4);border:2px solid rgba(140,190,255,.7)}
#btns{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:8;display:none;gap:16px;direction:ltr}
.rb{width:66px;height:66px;border-radius:50%;border:2px solid rgba(110,160,255,.55);background:rgba(15,30,70,.45);color:#fff;font-size:28px;padding:0;touch-action:none}
.rb.on{background:rgba(60,120,255,.55)}
#bPause{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));z-index:8;width:44px;height:44px;border-radius:12px;border:1px solid rgba(110,160,255,.4);background:rgba(10,20,50,.45);color:#cfe;font-size:18px;display:none;padding:0}
#flash{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;background:#a00}
#scr{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(4,8,22,.55),rgba(0,0,0,.92));overflow:auto;padding:16px}
#scr.show{display:flex}
.box{max-width:560px;width:100%;text-align:center;margin:auto}
h1{margin:0 0 10px;font-size:clamp(34px,8vw,58px);letter-spacing:1px;color:#e6efff;text-shadow:0 0 14px #1f5bff,0 0 36px #0a2a8a}

a.back{display:block;margin-top:16px;color:#7fa3e6;font-size:15px;text-decoration:none}

<body>

  <div class="row"><span>📜</span><b id="pg">0/6</b></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('game'), cctx=cv.getContext('2d',{alpha:false});
const scv=$('scare'), sctx=scv.getContext('2d');
const T=64, TM=63, MW=23, MH=23, TP=6, TB=7;
const FOV=72*Math.PI/180, PL=Math.tan(FOV/2), FK=1.5;
const DX=[1,-1,0,0], DY=[0,0,1,-1];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const amb=d=>0.025+0.28/(1+3*d*d);

/* ============ textures ============ */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function vnoise(cells,rng){
  const g=new Float32Array(cells*cells);for(let i=0;i<g.length;i++)g[i]=rng();
  const out=new Float32Array(T*T), s=T/cells;
  for(let y=0;y<T;y++)for(let x=0;x<T;x++){
    const gx=x/s, gy=y/s, x0=Math.floor(gx), y0=Math.floor(gy), fx=gx-x0, fy=gy-y0;
    const sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy), x1=(x0+1)%cells, y1=(y0+1)%cells;
    out[y*T+x]=lerp(lerp(g[y0*cells+x0],g[y0*cells+x1],sx),lerp(g[y1*cells+x0],g[y1*cells+x1],sx),sy);
  }
  return out;
}
function put(d,i,r,g,b){d[i]=clamp(r,0,255);d[i+1]=clamp(g,0,255);d[i+2]=clamp(b,0,255)}
function genWall(stain,seed){
  const rng=mulberry(seed), d=new Uint8Array(T*T*3);
  const n1=vnoise(8,rng), n2=vnoise(16,rng), n3=vnoise(4,rng);
  const drips=[];
  if(stain)for(let k=0;k<5;k++)drips.push({x:Math.floor(rng()*T),w:1+Math.floor(rng()*3),len:12+rng()*40});
  for(let y=0;y<T;y++)for(let x=0;x<T;x++){
    const row=y>>4, off=(row&1)?16:0, xx=(x+off)&63, bx=xx&31, by=y&15;
    const brick=(xx>>5)+row*3+(row&1)*2;
    const tint=((brick*2654435761)>>>0)%100/100;
    const k=y*T+x;
    let v=96+tint*26+(n1[k]-.5)*46+(n2[k]-.5)*26+(rng()-.5)*18;
    if(by<2||bx<2)v*=.5; else if(by===2||bx===2)v*=1.12;
    const gr=Math.abs(y/T-.5)*2; v*=1-.4*gr*gr*gr;
    let r=v*1.04, g=v*.97, b=v*.92;
    if(n3[k]>.68){g*=1.12;r*=.85}
    if(stain){
      let a=0;
      for(const dr of drips)if(x>=dr.x&&x<dr.x+dr.w&&y<dr.len)a=Math.max(a,.85-y/dr.len*.3);
      if(n3[k]>.72&&n1[k]>.5)a=Math.max(a,.65);
      if(a>0){r=lerp(r,120,a);g=lerp(g,10,a);b=lerp(b,12,a)}
    }
    put(d,k*3,r,g,b);
  }
  return d;
}
const doorLamp=new Uint8Array(T*T);
function genDoor(){
  const rng=mulberry(777), d=new Uint8Array(T*T*3), n=vnoise(8,rng);
  for(let y=0;y<T;y++)for(let x=0;x<T;x++){
    const k=y*T+x;
    let v=70+(n[k]-.5)*30+(rng()-.5)*10;
    if(y<3||(y>28&&y<33)||y>60)v*=.55;
    if(x>=31&&x<=32)v*=.5;
    if(x<2||x>61)v*=.6;
    let r=v*.9,g=v*.98,b=v*1.1;
    if(y>=40&&y<=47){ if(((x+y)>>3)&1){r=190;g=155;b=20}else{r=34;g=34;b=34} r*=.8;g*=.8;b*=.8 }
    const rv=[[6,6],[57,6],[6,57],[57,57],[6,36],[57,36]];
    for(const p of rv){const dx=x-p[0],dy=y-p[1];if(dx*dx+dy*dy<5){r=g=b=130}}
    if(y>=12&&y<=17&&x>=24&&x<=39){doorLamp[k]=1;r=g=b=30}
    put(d,k*3,r,g,b);
  }
  return d;
}
function genFloor(){
  const rng=mulberry(31), d=new Uint8Array(T*T*3), n1=vnoise(8,rng), n2=vnoise(16,rng), n3=vnoise(4,rng);
  for(let y=0;y<T;y++)for(let x=0;x<T;x++){
    const k=y*T+x, tile=(x>>5)+(y>>5)*2;
    let v=66+((tile*37)%11)-5+(n1[k]-.5)*34+(n2[k]-.5)*18+(rng()-.5)*12;
    if((x&31)<1||(y&31)<1)v*=.45;
    let r=v,g=v*1.01,b=v*1.06;
    if(n3[k]>.6){r*=.7;g*=.76;b*=.9}
    put(d,k*3,r,g,b);
  }
  return d;
}
function genCeil(){
  const rng=mulberry(99), d=new Uint8Array(T*T*3), n1=vnoise(8,rng), n3=vnoise(4,rng);
  for(let y=0;y<T;y++)for(let x=0;x<T;x++){
    const k=y*T+x;
    let v=48+(n1[k]-.5)*30+(rng()-.5)*10;
    if(y<4||(y>31&&y<36))v*=.6;
    let r=v,g=v,b=v*1.05;
    if(n3[k]>.65){r*=1.15;g*=1.0;b*=.8}
    put(d,k*3,r,g,b);
  }
  return d;
}
const TEX={wall:genWall(false,1234),stain:genWall(true,4321),door:genDoor(),floor:genFloor(),ceil:genCeil()};
const WALLTEX=[null,TEX.wall,TEX.door,TEX.stain];

/* ============ sprites ============ */
function mkC(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function fromC(c){return{w:c.width,h:c.height,d:c.getContext('2d').getImageData(0,0,c.width,c.height).data}}
function makeMonster(){
  const c=mkC(96,192), g=c.getContext('2d');
  const gr=g.createLinearGradient(0,50,0,192);gr.addColorStop(0,'#14141c');gr.addColorStop(1,'#030305');
  g.fillStyle=gr;g.beginPath();
  const pts=[[34,58],[62,58],[70,110],[76,170],[70,188],[64,176],[58,192],[52,180],[46,192],[40,178],[34,190],[28,176],[22,170],[26,110]];
  g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();g.fill();
  g.strokeStyle='#0c0c12';g.lineCap='round';g.lineWidth=6;
  g.beginPath();g.moveTo(33,64);g.quadraticCurveTo(12,112,18,158);g.stroke();
  g.beginPath();g.moveTo(63,64);g.quadraticCurveTo(84,112,78,158);g.stroke();
  g.lineWidth=2;
  [[18,158,-10],[18,158,0],[18,158,9],[78,158,-9],[78,158,0],[78,158,10]].forEach(f=>{g.beginPath();g.moveTo(f[0],f[1]);g.lineTo(f[0]+f[2]*0.9,f[1]+16);g.stroke()});
  g.fillStyle='#0a0a10';g.fillRect(44,50,8,12);
  const hg=g.createRadialGradient(48,30,4,48,34,26);hg.addColorStop(0,'#ddd7cb');hg.addColorStop(1,'#6f6b64');
  g.fillStyle=hg;g.beginPath();g.ellipse(48,34,14,22,0,0,Math.PI*2);g.fill();
  g.fillStyle='#000';
  g.beginPath();g.ellipse(41,30,5,7,0,0,Math.PI*2);g.fill();
  g.beginPath();g.ellipse(55,30,5,7,0,0,Math.PI*2);g.fill();
  g.fillStyle='#ff1818';
  g.beginPath();g.arc(41,31,2.4,0,Math.PI*2);g.fill();
  g.beginPath();g.arc(55,31,2.4,0,Math.PI*2);g.fill();
  g.fillStyle='#050000';g.beginPath();g.ellipse(48,50,4.5,8,0,0,Math.PI*2);g.fill();
  g.fillStyle='#d8d2c6';for(let i=0;i<5;i++)g.fillRect(44+i*2,44,1,4);
  g.strokeStyle='#4a4640';g.lineWidth=1;
  g.beginPath();g.moveTo(48,38);g.lineTo(47,44);g.moveTo(37,18);g.lineTo(42,24);g.moveTo(59,20);g.lineTo(55,25);g.stroke();
  return c;
}
function makePage(){
  const c=mkC(40,56), g=c.getContext('2d');
  const rg=g.createRadialGradient(20,28,2,20,28,26);rg.addColorStop(0,'rgba(210,225,255,.38)');rg.addColorStop(1,'rgba(210,225,255,0)');
  g.fillStyle=rg;g.fillRect(0,0,40,56);
  g.save();g.translate(20,28);g.rotate(-.12);
  g.fillStyle='#e6e0c8';g.fillRect(-12,-20,24,40);
  g.strokeStyle='#8a8266';g.lineWidth=1;g.strokeRect(-12,-20,24,40);
  g.strokeStyle='#3a2a20';
  for(let i=0;i<6;i++){g.beginPath();g.moveTo(-9,-14+i*4.5);g.lineTo(-9+10+((i*7)%9),-14+i*4.5+((i%2)?1:-1));g.stroke()}
  g.strokeStyle='#8a1010';g.lineWidth=1.6;
  g.beginPath();g.arc(0,12,5,0,Math.PI*2);g.stroke();
  g.beginPath();g.moveTo(-3,12);g.lineTo(3,12);g.stroke();
  g.restore();
  return c;
}
function makeBattery(){
  const c=mkC(32,48), g=c.getContext('2d');
  const rg=g.createRadialGradient(16,28,2,16,28,20);rg.addColorStop(0,'rgba(200,255,160,.3)');rg.addColorStop(1,'rgba(200,255,160,0)');
  g.fillStyle=rg;g.fillRect(0,0,32,48);
  const bg=g.createLinearGradient(11,0,21,0);bg.addColorStop(0,'#555');bg.addColorStop(.5,'#2b2b2b');bg.addColorStop(1,'#111');
  g.fillStyle=bg;g.fillRect(11,12,10,28);
  g.fillStyle='#d8c020';g.fillRect(11,20,10,8);
  g.fillStyle='#aaa';g.fillRect(13,8,6,4);
  return c;
}
const monCanvas=makeMonster();
const SPR={mon:fromC(monCanvas),page:fromC(makePage()),batt:fromC(makeBattery())};

/* ============ state ============ */
let W=1,H=1,F=1,buf8=null,img=null,cone=null,vig=null,zbuf=null;
let budget=72000;
const grain=new Float32Array(4096);for(let i=0;i<4096;i++)grain[i]=Math.random();
let map=new Uint8Array(MW*MH), floorCells=[], door={x:0,y:0}, items=[];
let state='menu';
let posX=1.5,posY=1.5,yaw=0,dirX=1,dirY=0,planeX=0,planeY=PL,cy=0;
let pages=0,battery=100,stamina=100,exhausted=false,flashOn=true,runHeld=false;
let time=0,bob=0,bobT=0,shakeY=0,stepAcc=0,movingNow=false,runningNow=false;
let danger=0,dangerS=0,flick=1,flickT=0,flashMul=1,heartT=0,ambT=8,caughtT=0,msgT=0,noticeCd=0;
let joyX=0,joyY=0,lookSens=0.006;
const mon={x:0,y:0,state:'patrol',path:[],target:null,wait:0,repath:0,lostT:0,stepAcc:0,last:{x:0,y:0}};

/* ============ maze ============ */
function bfsDist(sx,sy){
  const d=new Int16Array(MW*MH).fill(-1), q=[sy*MW+sx];d[q[0]]=0;
  for(let h=0;h<q.length;h++){
    const c=q[h], x=c%MW, y=(c/MW)|0;
    for(let k=0;k<4;k++){const nx=x+DX[k],ny=y+DY[k];if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const ni=ny*MW+nx;if(map[ni]!==0||d[ni]!==-1)continue;d[ni]=d[c]+1;q.push(ni)}
  }
  return d;
}
function bfsPath(sx,sy,tx,ty){
  const n=MW*MH, prev=new Int16Array(n).fill(-2), q=new Int16Array(n);let h=0,t=0;
  const s=sy*MW+sx, g=ty*MW+tx;prev[s]=-1;q[t++]=s;
  while(h<t){
    const c=q[h++];if(c===g)break;
    const x=c%MW,y=(c/MW)|0;
    for(let k=0;k<4;k++){const nx=x+DX[k],ny=y+DY[k];if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const ni=ny*MW+nx;if(map[ni]!==0||prev[ni]!==-2)continue;prev[ni]=c;q[t++]=ni}
  }
  if(prev[g]===-2)return null;
  const path=[];let c=g;while(c!==s){path.push(c);c=prev[c]}
  path.reverse();return path;
}
function genMaze(){
  map=new Uint8Array(MW*MH).fill(1);
  const idx=(x,y)=>y*MW+x, st=[[1,1]];map[idx(1,1)]=0;
  while(st.length){
    const [cx,cy2]=st[st.length-1];let moved=false;
    for(const [dx,dy] of shuffle([[2,0],[-2,0],[0,2],[0,-2]])){
      const nx=cx+dx,ny=cy2+dy;
      if(nx>0&&ny>0&&nx<MW-1&&ny<MH-1&&map[idx(nx,ny)]===1){map[idx(cx+dx/2,cy2+dy/2)]=0;map[idx(nx,ny)]=0;st.push([nx,ny]);moved=true;break}
    }
    if(!moved)st.pop();
  }
  for(let k=0;k<4;k++){
    const w=(Math.random()<.5)?3:5, h=3;
    const rx=1+2*((Math.random()*((MW-1-w)/2))|0), ry=1+2*((Math.random()*((MH-1-h)/2))|0);
    for(let y=ry;y<ry+h&&y<MH-1;y++)for(let x=rx;x<rx+w&&x<MW-1;x++)map[idx(x,y)]=0;
    if(w===5&&Math.random()<.7)map[idx(rx+2,ry+1)]=1;
  }
  for(let k=0;k<(MW*MH)/12;k++){
    const x=1+((Math.random()*(MW-2))|0), y=1+((Math.random()*(MH-2))|0);
    if(map[idx(x,y)]!==1)continue;
    if((map[idx(x-1,y)]===0&&map[idx(x+1,y)]===0)||(map[idx(x,y-1)]===0&&map[idx(x,y+1)]===0))map[idx(x,y)]=0;
  }
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(map[idx(x,y)]!==1)continue;
    let near=false;for(let k=0;k<4;k++){const nx=x+DX[k],ny=y+DY[k];if(nx>=0&&ny>=0&&nx<MW&&ny<MH&&map[idx(nx,ny)]===0)near=true}
    if(near&&Math.random()<.11)map[idx(x,y)]=3;
  }
  const d0=bfsDist(1,1);
  let best=-1,bx=0,by=0;
  const cand=[];
  for(let x=1;x<MW-1;x++){cand.push([x,0,x,1]);cand.push([x,MH-1,x,MH-2])}
  for(let y=1;y<MH-1;y++){cand.push([0,y,1,y]);cand.push([MW-1,y,MW-2,y])}
  for(const c of cand){const di=d0[c[3]*MW+c[2]];if(di>best){best=di;bx=c[0];by=c[1]}}
  door={x:bx,y:by};map[by*MW+bx]=2;
  floorCells=[];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(map[idx(x,y)]===0)floorCells.push({x,y,d:d0[idx(x,y)]});
}
function placeThings(){
  const pool=floorCells.filter(c=>c.d>=6);shuffle(pool);
  items=[];
  const pick=(n,sep,minD,type)=>{
    let got=0;
    for(const sepTry of [sep,sep*0.7,sep*0.4,0]){
      for(const c of pool){
        if(got>=n)break;
        if(c.d<minD||c.used)continue;
        let ok=true;for(const it of items){if(Math.hypot(it.x-(c.x+.5),it.y-(c.y+.5))<sepTry){ok=false;break}}
        if(!ok)continue;
        c.used=true;got++;
        items.push({type,x:c.x+.5,y:c.y+.5,taken:false,ph:Math.random()*6});
      }
      if(got>=n)break;
    }
  };
  pick(TP,8,6,'page');pick(TB,5,4,'batt');
  let far=floorCells.slice().sort((a,b)=>b.d-a.d);
  const top=far.slice(0,Math.max(5,(far.length*.12)|0));
  const m=top[(Math.random()*top.length)|0];
  mon.x=m.x+.5;mon.y=m.y+.5;mon.state='patrol';mon.path=[];mon.target=null;mon.wait=6;mon.repath=0;mon.lostT=0;mon.stepAcc=0;
}

  const sc=(h*(.7+Math.min(caughtT,1.5)*.25))/70;
  const sx=(Math.random()-.5)*12,sy=(Math.random()-.5)*12;
  sctx.imageSmoothingEnabled=true;
  sctx.drawImage(monCanvas,20,0,56,70,w/2-28*sc+sx,h*.06+sy,56*sc,70*sc);
  if(Math.random()<.25){sctx.fillStyle='rgba(255,0,0,.35)';sctx.fillRect(0,0,w,h)}
  if(caughtT>1.8)endDead();
}

/* ============ render ============ */
function resize(){
  const aw=innerWidth||800,ah=innerHeight||450,asp=aw/ah;
  W=Math.max(120,Math.round(Math.sqrt(budget*asp)));H=Math.max(80,Math.round(W/asp));
  cv.width=W;cv.height=H;img=cctx.createImageData(W,H);buf8=img.data;
  for(let i=3;i<buf8.length;i+=4)buf8[i]=255;
  F=(W/2)/PL;zbuf=new Float32Array(W);
  cone=new Float32Array(W*H);vig=new Float32Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const dx=(x+.5-W/2)/F,dy=(y+.5-H*.54)/F,a=Math.sqrt(dx*dx+dy*dy);
    const t=smooth(0,1,1-a/.62);cone[y*W+x]=Math.pow(t,1.25);
    const nx=(x/W)*2-1,ny=(y/H)*2-1;
    vig[y*W+x]=1-.78*smooth(.5,1.3,Math.sqrt(nx*nx+ny*ny));
  }
  scv.width=aw;scv.height=ah;
}
function drawSprite(s,fm){
  const rx=s.x-posX,ry=s.y-posY,a=rx*dirX+ry*dirY;
  if(a<.12)return;
  const b=(dirX*ry-dirY*rx)/PL, sxs=(W/2)*(1+b/a);
  const hpx=F*s.scale/a, wpx=hpx*s.tex.w/s.tex.h;
  const bottom=cy+F*(.5-s.z)/a, top=bottom-hpx;
  const x0=Math.floor(sxs-wpx/2), x1=Math.floor(sxs+wpx/2);
  const y0=Math.max(0,Math.floor(top)), y1=Math.min(H-1,Math.floor(bottom));
  if(x1<0||x0>=W||y1<y0)return;
  const Lf=fm/(1+.1*a*a), La=amb(a), tw=s.tex.w, th=s.tex.h, td=s.tex.d, gl=s.glow, xe=Math.min(W-1,x1);
  for(let x=Math.max(0,x0);x<=xe;x++){
    if(a>=zbuf[x])continue;
    const u=Math.min(tw-1,((x-x0)/(x1-x0+1)*tw)|0);
    for(let y=y0;y<=y1;y++){
      const v=Math.min(th-1,Math.max(0,((y-top)/hpx*th)|0)), ti=(v*tw+u)*4, al=td[ti+3];
      if(al<24)continue;
      const r=td[ti],g=td[ti+1],bl=td[ti+2], p=(y*W+x)*4;
      let lr,lg,lb;
      if(r>215&&g<80&&bl<80){lr=lg=lb=1}
      else{const lf=Lf*cone[y*W+x];lr=lf+La*.55+gl;lg=lf*.93+La*.72+gl;lb=lf*.78+La+gl}
      const aa=al/255,ia=1-aa;
      buf8[p]=buf8[p]*ia+r*lr*aa;buf8[p+1]=buf8[p+1]*ia+g*lg*aa;buf8[p+2]=buf8[p+2]*ia+bl*lb*aa;
    }
  }
}
function render(){
  cy=H*.5+bob+shakeY;
  const dX=Math.cos(yaw),dY=Math.sin(yaw);dirX=dX;dirY=dY;planeX=-dY*PL;planeY=dX*PL;
  const fm=flashMul*FK, floorT=TEX.floor, ceilT=TEX.ceil;
  for(let y=0;y<H;y++){
    const p=y+.5-cy;
    let o=y*W,p4=o*4;
    if(p>-.6&&p<.6){for(let x=0;x<W;x++){buf8[p4]=buf8[p4+1]=buf8[p4+2]=0;p4+=4}continue}
    const rd=F*.5/Math.abs(p), Lf=fm/(1+.1*rd*rd), La=amb(rd), tex=p>0?floorT:ceilT;
    const stX=rd*2*planeX/W, stY=rd*2*planeY/W;
    let fx=posX+rd*(dX-planeX), fy=posY+rd*(dY-planeY);
    const ra=La*.55,ga=La*.72,ba=La;
    for(let x=0;x<W;x++){
      const tx=((fx*T)|0)&TM, ty=((fy*T)|0)&TM, ti=((ty<<6)+tx)*3, lf=Lf*cone[o+x];
      buf8[p4]=tex[ti]*(lf+ra);buf8[p4+1]=tex[ti+1]*(lf*.93+ga);buf8[p4+2]=tex[ti+2]*(lf*.78+ba);
      p4+=4;fx+=stX;fy+=stY;
    }
  }
  const unlocked=pages>=TP;
  for(let x=0;x<W;x++){
    const cxn=2*x/W-1, rdx=dX+planeX*cxn, rdy=dY+planeY*cxn;
    let mx=posX|0,my=posY|0;
    const ddx=rdx===0?1e30:Math.abs(1/rdx), ddy=rdy===0?1e30:Math.abs(1/rdy);
    let stepX,stepY,sdx,sdy;
    if(rdx<0){stepX=-1;sdx=(posX-mx)*ddx}else{stepX=1;sdx=(mx+1-posX)*ddx}
    if(rdy<0){stepY=-1;sdy=(posY-my)*ddy}else{stepY=1;sdy=(my+1-posY)*ddy}
    let side=0,type=1;
    for(;;){
      if(sdx<sdy){sdx+=ddx;mx+=stepX;side=0}else{sdy+=ddy;my+=stepY;side=1}
      if(mx<0||my<0||mx>=MW||my>=MH){type=1;break}
      const c=map[my*MW+mx];if(c){type=c;break}
    }
    let perp=side===0?sdx-ddx:sdy-ddy;if(perp<.05)perp=.05;
    zbuf[x]=perp;
    let wx=side===0?posY+perp*rdy:posX+perp*rdx;wx-=Math.floor(wx);
    let texX=(wx*T)|0;
    if(side===0&&rdx>0)texX=T-1-texX;
    if(side===1&&rdy<0)texX=T-1-texX;
    const lineH=F/perp, yt=cy-lineH*.5, yb=cy+lineH*.5;
    const ys=Math.max(0,Math.floor(yt)), ye=Math.min(H-1,Math.floor(yb));
    const stp=T/lineH;let tp=(ys-yt)*stp;
    const tex=WALLTEX[type]||TEX.wall;
    const Lf=fm/(1+.1*perp*perp), La=amb(perp), sh=side?.8:1, ra=La*.55,ga=La*.72;
    const isDoor=type===2;
    for(let y=ys;y<=ye;y++){
      let ty=tp|0;if(ty>TM)ty=TM;if(ty<0)ty=0;tp+=stp;
      const k=(ty<<6)+texX, ti=k*3, p4=(y*W+x)*4;
      if(isDoor&&doorLamp[k]){
        if(unlocked){buf8[p4]=40;buf8[p4+1]=230;buf8[p4+2]=90}
        else{const pu=.7+.3*Math.sin(time*3);buf8[p4]=210*pu;buf8[p4+1]=25*pu;buf8[p4+2]=20*pu}
        continue;
      }
      const lf=Lf*cone[y*W+x];
      buf8[p4]=tex[ti]*(lf+ra)*sh;buf8[p4+1]=tex[ti+1]*(lf*.93+ga)*sh;buf8[p4+2]=tex[ti+2]*(lf*.78+La)*sh;
    }
  }
  const list=[];
  for(const it of items){
    if(it.taken)continue;
    const isP=it.type==='page';
    list.push({x:it.x,y:it.y,z:(isP?.22+.05*Math.sin(time*2+it.ph):.02),scale:isP?.38:.3,tex:isP?SPR.page:SPR.batt,glow:isP?.3:.2,d:(it.x-posX)*(it.x-posX)+(it.y-posY)*(it.y-posY)});
  }
  list.push({x:mon.x,y:mon.y,z:0,scale:1.15,tex:SPR.mon,glow:0,d:(mon.x-posX)*(mon.x-posX)+(mon.y-posY)*(mon.y-posY)});
  list.sort((a,b)=>b.d-a.d);
  for(const s of list)drawSprite(s,fm);
  const N=W*H, go=(Math.random()*4096)|0, ga2=5+dangerS*dangerS*38+(state==='caught'?30:0), rt=dangerS*dangerS*22;
  for(let i=0,p=0;i<N;i++,p+=4){
    const v=vig[i], n=(grain[(i+go)&4095]-.5)*ga2;
    buf8[p]=buf8[p]*v+n+rt*v;buf8[p+1]=buf8[p+1]*v+n;buf8[p+2]=buf8[p+2]*v+n;
  }
  cctx.putImageData(img,0,0);
}

/* ============ loop ============ */
let last=0,fpsAcc=0,fpsN=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;
  if(state==='paused')return;
  if(state==='playing')update(dt);
  else if(state==='caught')updateCaught(dt);
  else if(state==='menu'){yaw+=dt*.12;flashMul=1;bob=0;shakeY=0}
  else{flashMul=Math.max(flashMul,0)}
  render();
  fpsAcc+=dt;fpsN++;
  if(fpsAcc>1.6){
    const fps=fpsN/fpsAcc;fpsAcc=0;fpsN=0;
    if(fps<38&&budget>28000){budget=Math.round(budget*.75);resize()}
  }
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,250));
resize();newGame();showScreen('menu');
requestAnimationFrame(frame);
})();
</script>
