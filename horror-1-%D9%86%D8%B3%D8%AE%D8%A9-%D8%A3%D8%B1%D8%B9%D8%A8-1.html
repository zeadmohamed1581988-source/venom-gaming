<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>الممر المظلم: النسخة المرعبة</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#cfd8e6}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;background:#000}
#scare{display:none;z-index:15;pointer-events:none}
#touch{position:fixed;inset:0;z-index:5;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;z-index:6;pointer-events:none;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));display:none;direction:ltr}
#hud .row{display:flex;align-items:center;gap:10px;font-size:18px;text-shadow:0 0 6px #000}
.bar{width:92px;height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px;border:1px solid rgba(120,160,255,.25)}
.bar i{display:block;height:100%;width:100%;background:#e8d27a;transition:width .15s}
.bar.st i{background:#5aa0ff}
.bar.low i{background:#e03a3a}
#msg{position:fixed;left:0;right:0;top:22%;z-index:7;text-align:center;font-size:22px;color:#e8eefc;text-shadow:0 0 12px #000,0 0 4px #000;opacity:0;transition:opacity .5s;pointer-events:none;padding:0 20px}
#msg.red{color:#ff4a4a;text-shadow:0 0 14px #600,0 0 4px #000;letter-spacing:1px}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(80,140,255,.45);background:rgba(20,40,90,.18);display:none;z-index:7;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(90,150,255,.4);border:2px solid rgba(140,190,255,.7)}
#btns{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:8;display:none;gap:16px;direction:ltr}
.rb{width:66px;height:66px;border-radius:50%;border:2px solid rgba(110,160,255,.55);background:rgba(15,30,70,.45);color:#fff;font-size:28px;padding:0;touch-action:none}
.rb.on{background:rgba(60,120,255,.55)}
#bPause{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));z-index:8;width:44px;height:44px;border-radius:12px;border:1px solid rgba(110,160,255,.4);background:rgba(10,20,50,.45);color:#cfe;font-size:18px;display:none;padding:0}
#flash{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;background:#a00}
#scr{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(4,8,22,.55),rgba(0,0,0,.92));overflow:auto;padding:16px}
#scr.show{display:flex}
.box{max-width:560px;width:100%;text-align:center;margin:auto}
h1{margin:0 0 10px;font-size:clamp(34px,8vw,58px);letter-spacing:1px;color:#e6efff;text-shadow:0 0 14px #1f5bff,0 0 36px #0a2a8a}
h1.red{color:#ff4a4a;text-shadow:0 0 14px #a00,0 0 36px #600}
p.lead{font-size:18px;line-height:1.7;margin:8px 0 12px;color:#b9c8e6}
ul{list-style:none;padding:0;margin:10px 0;font-size:15px;line-height:1.9;color:#9fb2d6;text-align:right}
.warn{font-size:13px;color:#d99;margin:10px 0 16px}
button.big{font-size:22px;padding:14px 38px;border-radius:12px;border:1px solid #2f7bff;background:linear-gradient(#10224f,#08122c);color:#fff;box-shadow:0 0 18px rgba(47,123,255,.45);font-family:inherit}
button.big:active{transform:scale(.97)}
a.back{display:block;margin-top:16px;color:#7fa3e6;font-size:15px;text-decoration:none}

/* HORROR PLUS layer — preserves the original monster artwork */
#fearVignette{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at center,transparent 28%,rgba(0,0,0,.18) 62%,rgba(0,0,0,.86) 115%);opacity:.9;mix-blend-mode:multiply}
#fearNoise{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 4px);}
#fearWhisper{position:fixed;left:8%;right:8%;top:35%;z-index:11;pointer-events:none;text-align:center;font-size:clamp(20px,5vw,34px);font-weight:900;letter-spacing:3px;color:#dbe4ef;text-shadow:0 0 5px #fff,0 0 18px #b00020,0 0 35px #8b0000;opacity:0;transition:opacity .25s;}
@keyframes fearGlitch{0%,100%{transform:translate(0,0)}20%{transform:translate(-3px,1px)}40%{transform:translate(2px,-2px)}60%{transform:translate(-1px,2px)}80%{transform:translate(3px,0)}}
@keyframes fearPulse{0%,100%{opacity:.15}50%{opacity:.65}}
body.fear-shake #game{animation:fearGlitch .16s steps(2,end) 3}
body.fear-red #fearNoise{opacity:.8;background:rgba(110,0,8,.24);animation:fearPulse .12s 2}

</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="scare"></canvas>
<div id="touch"></div>
<div id="fearVignette"></div><div id="fearNoise"></div><div id="fearWhisper"></div>
<div id="hud">
  <div class="row"><span>📜</span><b id="pg">0/6</b></div>
  <div class="bar" id="batBar" title="battery"><i id="bat"></i></div>
  <div class="bar st"><i id="stm"></i></div>
</div>
<div id="msg"></div>
<div id="joy"><div id="knob"></div></div>
<div id="btns"><button class="rb" id="bFl">🔦</button><button class="rb" id="bRun">🏃</button></div>
<button id="bPause">⏸</button>
<div id="flash"></div>
<div id="scr"></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('game'), cctx=cv.getContext('2d',{alpha:false});
const scv=$('scare'), sctx=scv.getContext('2d');
const T=64, TM=63, MW=23, MH=23, TP=6, TB=7;
const FOV=72*Math.PI/180, PL=Math.tan(FOV/2), FK=1.5;
const DX=[1,-1,0,0], DY=[0,0,1,-1];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let ambMul=1;
const amb=d=>ambMul*(0.025+0.28/(1+3*d*d));

/* ============ textures ============ */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function vnoise(cells,rng){
  const g=new Float32Array(cells*cells);for(let i=0;i<g.length;i++)g[i]=rng();
  const out=new Float32Array(T*T), s=T/cells;
  for(let y=0;y<T;y++)for(let x=0;x<T;x++){
    const gx=x/s, gy=y/s, x0=Math.floor(gx), y0=Math.floor(gy), fx=gx-x0, fy=gy-y0;
    const sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy), x1=(x0+1)%cells, y1=(y0+1)%cells;
    out[y*T+x]=lerp(lerp(g[y0*cells+x0],g[y0*cells+x1],sx),lerp(g[y1*cells+x0],g[y1*cells+x1],sx),sy);
  }
  return out;
}
function put(d,i,r,g,b){d[i]=clamp(r,0,255);d[i+1]=clamp(g,0,255);d[i+2]=clamp(b,0,255)}
function genWall(stain,seed){
  const rng=mulberry(seed), d=new Uint8Array(T*T*3);
  const n1=vnoise(8,rng), n2=vnoise(16,rng), n3=vnoise(4,rng);
  const drips=[];
  if(stain)for(let k=0;k<5;k++)drips.push({x:Math.floor(rng()*T),w:1+Math.floor(rng()*3),len:12+rng()*40});
  for(let y=0;y<T;y++)for(let x=0;x<T;x++){
    const row=y>>4, off=(row&1)?16:0, xx=(x+off)&63, bx=xx&31, by=y&15;
    const brick=(xx>>5)+row*3+(row&1)*2;
    const tint=((brick*2654435761)>>>0)%100/100;
    const k=y*T+x;
    let v=96+tint*26+(n1[k]-.5)*46+(n2[k]-.5)*26+(rng()-.5)*18;
    if(by<2||bx<2)v*=.5; else if(by===2||bx===2)v*=1.12;
    const gr=Math.abs(y/T-.5)*2; v*=1-.4*gr*gr*gr;
    let r=v*1.04, g=v*.97, b=v*.92;
    if(n3[k]>.68){g*=1.12;r*=.85}
    if(stain){
      let a=0;
      for(const dr of drips)if(x>=dr.x&&x<dr.x+dr.w&&y<dr.len)a=Math.max(a,.85-y/dr.len*.3);
      if(n3[k]>.72&&n1[k]>.5)a=Math.max(a,.65);
      if(a>0){r=lerp(r,120,a);g=lerp(g,10,a);b=lerp(b,12,a)}
    }
    put(d,k*3,r,g,b);
  }
  return d;
}
const doorLamp=new Uint8Array(T*T);
function genDoor(){
  const rng=mulberry(777), d=new Uint8Array(T*T*3), n=vnoise(8,rng);
  for(let y=0;y<T;y++)for(let x=0;x<T;x++){
    const k=y*T+x;
    let v=70+(n[k]-.5)*30+(rng()-.5)*10;
    if(y<3||(y>28&&y<33)||y>60)v*=.55;
    if(x>=31&&x<=32)v*=.5;
    if(x<2||x>61)v*=.6;
    let r=v*.9,g=v*.98,b=v*1.1;
    if(y>=40&&y<=47){ if(((x+y)>>3)&1){r=190;g=155;b=20}else{r=34;g=34;b=34} r*=.8;g*=.8;b*=.8 }
    const rv=[[6,6],[57,6],[6,57],[57,57],[6,36],[57,36]];
    for(const p of rv){const dx=x-p[0],dy=y-p[1];if(dx*dx+dy*dy<5){r=g=b=130}}
    if(y>=12&&y<=17&&x>=24&&x<=39){doorLamp[k]=1;r=g=b=30}
    put(d,k*3,r,g,b);
  }
  return d;
}
function genFloor(){
  const rng=mulberry(31), d=new Uint8Array(T*T*3), n1=vnoise(8,rng), n2=vnoise(16,rng), n3=vnoise(4,rng);
  for(let y=0;y<T;y++)for(let x=0;x<T;x++){
    const k=y*T+x, tile=(x>>5)+(y>>5)*2;
    let v=66+((tile*37)%11)-5+(n1[k]-.5)*34+(n2[k]-.5)*18+(rng()-.5)*12;
    if((x&31)<1||(y&31)<1)v*=.45;
    let r=v,g=v*1.01,b=v*1.06;
    if(n3[k]>.6){r*=.7;g*=.76;b*=.9}
    put(d,k*3,r,g,b);
  }
  return d;
}
function genCeil(){
  const rng=mulberry(99), d=new Uint8Array(T*T*3), n1=vnoise(8,rng), n3=vnoise(4,rng);
  for(let y=0;y<T;y++)for(let x=0;x<T;x++){
    const k=y*T+x;
    let v=48+(n1[k]-.5)*30+(rng()-.5)*10;
    if(y<4||(y>31&&y<36))v*=.6;
    let r=v,g=v,b=v*1.05;
    if(n3[k]>.65){r*=1.15;g*=1.0;b*=.8}
    put(d,k*3,r,g,b);
  }
  return d;
}
const TEX={wall:genWall(false,1234),stain:genWall(true,4321),door:genDoor(),floor:genFloor(),ceil:genCeil()};
const WALLTEX=[null,TEX.wall,TEX.door,TEX.stain];

/* ============ sprites ============ */
function mkC(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function fromC(c){return{w:c.width,h:c.height,d:c.getContext('2d').getImageData(0,0,c.width,c.height).data}}
function ell(g,x,y,rx,ry,rot){g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);g.fill()}
function dot(g,x,y,r){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
function makeStalker(){
  const c=mkC(96,192), g=c.getContext('2d');
  const gr=g.createLinearGradient(0,50,0,192);gr.addColorStop(0,'#14141c');gr.addColorStop(1,'#030305');
  g.fillStyle=gr;g.beginPath();
  const pts=[[34,58],[62,58],[70,110],[76,170],[70,188],[64,176],[58,192],[52,180],[46,192],[40,178],[34,190],[28,176],[22,170],[26,110]];
  g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();g.fill();
  g.strokeStyle='#0c0c12';g.lineCap='round';g.lineWidth=6;
  g.beginPath();g.moveTo(33,64);g.quadraticCurveTo(12,112,18,158);g.stroke();
  g.beginPath();g.moveTo(63,64);g.quadraticCurveTo(84,112,78,158);g.stroke();
  g.lineWidth=2;
  [[18,158,-10],[18,158,0],[18,158,9],[78,158,-9],[78,158,0],[78,158,10]].forEach(f=>{g.beginPath();g.moveTo(f[0],f[1]);g.lineTo(f[0]+f[2]*0.9,f[1]+16);g.stroke()});
  g.fillStyle='#0a0a10';g.fillRect(44,50,8,12);
  const hg=g.createRadialGradient(48,30,4,48,34,26);hg.addColorStop(0,'#ddd7cb');hg.addColorStop(1,'#6f6b64');
  g.fillStyle=hg;ell(g,48,34,14,22);
  g.fillStyle='#000';ell(g,41,30,5,7);ell(g,55,30,5,7);
  g.fillStyle='#ff1818';dot(g,41,31,2.4);dot(g,55,31,2.4);
  g.fillStyle='#050000';ell(g,48,50,4.5,8);
  g.fillStyle='#d8d2c6';for(let i=0;i<5;i++)g.fillRect(44+i*2,44,1,4);
  g.strokeStyle='#4a4640';g.lineWidth=1;
  g.beginPath();g.moveTo(48,38);g.lineTo(47,44);g.moveTo(37,18);g.lineTo(42,24);g.moveTo(59,20);g.lineTo(55,25);g.stroke();
  return c;
}
function makeBrute(){
  const c=mkC(128,192), g=c.getContext('2d');
  g.fillStyle='#1b1613';g.fillRect(36,150,24,42);g.fillRect(68,150,24,42);
  const ag=g.createLinearGradient(0,70,0,170);ag.addColorStop(0,'#8a7a6e');ag.addColorStop(1,'#4a3d36');
  g.fillStyle=ag;ell(g,17,118,14,52,.08);ell(g,111,118,14,52,-.08);dot(g,15,168,13);dot(g,113,168,13);
  const bg=g.createRadialGradient(64,100,10,64,110,70);bg.addColorStop(0,'#9a8a7c');bg.addColorStop(1,'#3a2e2a');
  g.fillStyle=bg;ell(g,64,108,48,58);
  g.fillStyle='#2b201a';g.beginPath();g.moveTo(36,80);g.lineTo(92,80);g.lineTo(98,162);g.lineTo(30,162);g.closePath();g.fill();
  g.fillStyle='rgba(120,10,10,.8)';[[50,110,8,14],[78,128,10,18],[60,148,12,10],[44,134,6,12]].forEach(s=>ell(g,s[0],s[1],s[2],s[3]));
  g.fillStyle='#4a3020';g.fillRect(109,160,8,26);
  g.fillStyle='#b4b8c0';g.beginPath();g.moveTo(104,140);g.lineTo(127,140);g.lineTo(127,166);g.lineTo(106,166);g.closePath();g.fill();
  g.strokeStyle='#5a0a0a';g.lineWidth=2;g.beginPath();g.moveTo(106,166);g.lineTo(127,166);g.stroke();
  g.fillStyle='#6b5a45';ell(g,64,42,24,28);
  g.fillStyle='#000';ell(g,55,40,5,4);ell(g,73,40,5,4);
  g.fillStyle='#ff1818';dot(g,55,40,2.2);dot(g,73,40,2.2);
  g.strokeStyle='#18100a';g.lineWidth=1.5;g.beginPath();g.moveTo(52,56);g.lineTo(76,56);g.stroke();
  for(let i=0;i<6;i++){g.beginPath();g.moveTo(53+i*4.6,53);g.lineTo(54+i*4.6,59);g.stroke()}
  return c;
}
function makeCrawler(){
  const c=mkC(128,80), g=c.getContext('2d');
  g.strokeStyle='#0d0d12';g.lineWidth=3;g.lineCap='round';g.lineJoin='round';
  for(let s=-1;s<=1;s+=2)for(let i=0;i<4;i++){
    g.beginPath();g.moveTo(64+s*10,52);g.lineTo(64+s*(30+i*8),18+i*10);g.lineTo(64+s*(46+i*4),76);g.stroke();
  }
  const bg=g.createRadialGradient(64,54,2,64,54,26);bg.addColorStop(0,'#24242c');bg.addColorStop(1,'#08080c');
  g.fillStyle=bg;ell(g,64,54,24,13);
  const hg=g.createRadialGradient(64,36,2,64,40,18);hg.addColorStop(0,'#d6d0c4');hg.addColorStop(1,'#6a665e');
  g.fillStyle=hg;ell(g,64,40,15,17);
  g.fillStyle='#000';ell(g,57,36,4,5);ell(g,71,36,4,5);
  g.fillStyle='#ff1818';dot(g,57,37,2);dot(g,71,37,2);dot(g,61,28,1.5);dot(g,67,28,1.5);
  g.fillStyle='#050000';ell(g,64,48,8,5);
  g.fillStyle='#e0dacd';for(let i=0;i<6;i++){g.fillRect(57+i*2.4,44,1.2,3);g.fillRect(57+i*2.4,50,1.2,3)}
  return c;
}
function makeStatue(){
  const c=mkC(64,160), g=c.getContext('2d');
  const rg=g.createLinearGradient(0,50,0,160);rg.addColorStop(0,'#9a9a95');rg.addColorStop(1,'#4a4a46');
  g.fillStyle=rg;g.beginPath();g.moveTo(22,50);g.lineTo(42,50);g.lineTo(52,110);g.lineTo(58,158);g.lineTo(6,158);g.lineTo(12,110);g.closePath();g.fill();
  g.strokeStyle='#7c7c78';g.lineWidth=6;g.lineCap='round';
  g.beginPath();g.moveTo(22,54);g.quadraticCurveTo(8,44,24,32);g.stroke();
  g.beginPath();g.moveTo(42,54);g.quadraticCurveTo(56,44,40,32);g.stroke();
  const hg=g.createRadialGradient(32,26,2,32,30,20);hg.addColorStop(0,'#b0b0aa');hg.addColorStop(1,'#66665f');
  g.fillStyle=hg;ell(g,32,30,12,17);
  g.fillStyle='#a6a6a0';ell(g,26,30,6,12,.1);ell(g,38,30,6,12,-.1);
  g.strokeStyle='#4c4c47';g.lineWidth=1;
  for(let i=0;i<4;i++){g.beginPath();g.moveTo(22+i*2,20);g.lineTo(22+i*2,34);g.stroke();g.beginPath();g.moveTo(36+i*2,20);g.lineTo(36+i*2,34);g.stroke()}
  g.strokeStyle='rgba(20,20,20,.7)';g.lineWidth=2;g.beginPath();g.moveTo(27,42);g.lineTo(26,64);g.moveTo(37,42);g.lineTo(38,66);g.stroke();
  g.strokeStyle='#33332f';g.lineWidth=1;g.beginPath();g.moveTo(20,90);g.lineTo(28,110);g.lineTo(24,130);g.moveTo(44,80);g.lineTo(38,104);g.stroke();
  return c;
}
function makePage(){
  const c=mkC(40,56), g=c.getContext('2d');
  const rg=g.createRadialGradient(20,28,2,20,28,26);rg.addColorStop(0,'rgba(210,225,255,.38)');rg.addColorStop(1,'rgba(210,225,255,0)');
  g.fillStyle=rg;g.fillRect(0,0,40,56);
  g.save();g.translate(20,28);g.rotate(-.12);
  g.fillStyle='#e6e0c8';g.fillRect(-12,-20,24,40);
  g.strokeStyle='#8a8266';g.lineWidth=1;g.strokeRect(-12,-20,24,40);
  g.strokeStyle='#3a2a20';
  for(let i=0;i<6;i++){g.beginPath();g.moveTo(-9,-14+i*4.5);g.lineTo(-9+10+((i*7)%9),-14+i*4.5+((i%2)?1:-1));g.stroke()}
  g.strokeStyle='#8a1010';g.lineWidth=1.6;
  g.beginPath();g.arc(0,12,5,0,Math.PI*2);g.stroke();
  g.beginPath();g.moveTo(-3,12);g.lineTo(3,12);g.stroke();
  g.restore();
  return c;
}
function makeBattery(){
  const c=mkC(32,48), g=c.getContext('2d');
  const rg=g.createRadialGradient(16,28,2,16,28,20);rg.addColorStop(0,'rgba(200,255,160,.3)');rg.addColorStop(1,'rgba(200,255,160,0)');
  g.fillStyle=rg;g.fillRect(0,0,32,48);

function bfsDist(sx,sy){
  const d=new Int16Array(MW*MH).fill(-1), q=[sy*MW+sx];d[q[0]]=0;
  for(let h=0;h<q.length;h++){
    const c=q[h], x=c%MW, y=(c/MW)|0;
    for(let k=0;k<4;k++){const nx=x+DX[k],ny=y+DY[k];if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const ni=ny*MW+nx;if(map[ni]!==0||d[ni]!==-1)continue;d[ni]=d[c]+1;q.push(ni)}
  }
  return d;
}
function bfsPath(sx,sy,tx,ty){
  const n=MW*MH, prev=new Int16Array(n).fill(-2), q=new Int16Array(n);let h=0,t=0;
  const s=sy*MW+sx, g=ty*MW+tx;prev[s]=-1;q[t++]=s;
  while(h<t){
    const c=q[h++];if(c===g)break;
    const x=c%MW,y=(c/MW)|0;
    for(let k=0;k<4;k++){const nx=x+DX[k],ny=y+DY[k];if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const ni=ny*MW+nx;if(map[ni]!==0||prev[ni]!==-2)continue;prev[ni]=c;q[t++]=ni}
  }
  if(prev[g]===-2)return null;
  const path=[];let c=g;while(c!==s){path.push(c);c=prev[c]}
  path.reverse();return path;
}

    }

  }

    if(w===5&&Math.random()<.7)map[idx(rx+2,ry+1)]=1;
  }

    const x=1+((Math.random()*(MW-2))|0), y=1+((Math.random()*(MH-2))|0);

}

}

    }

      if(m.lostT>K.lose){m.state='search';m.target={x:m.last.x|0,y:m.last.y|0};m.path=[];m.wait=0;m.repath=0}
    }else if(heard){
      m.state='search';m.target={x:posX|0,y:posY|0};m.wait=0;
    }
    m.repath-=dt;
    const g=pages*K.gr;
    if(m.state==='chase'){
      const sp=K.ch+g;
      if(los&&md<2.6){
        const nx=m.x+dx/md*sp*dt,ny=m.y+dy/md*sp*dt;
        if(!solidAt(nx,ny)){m.x=nx;m.y=ny;moved=sp*dt}
        m.path=[];
      }else{
        if(m.repath<=0||!m.path.length){m.path=bfsPath(m.x|0,m.y|0,posX|0,posY|0)||[];m.repath=.25}
        moved=followPath(m,sp,dt);
      }
    }else if(m.state==='search'){
      const sp=K.srch+g*.5;
      if(m.repath<=0){m.path=bfsPath(m.x|0,m.y|0,m.target.x,m.target.y)||[];m.repath=.35}
      moved=followPath(m,sp,dt);
      if(!m.path.length&&(m.x|0)===m.target.x&&(m.y|0)===m.target.y){
        m.wait+=dt;if(m.wait>2.2){m.state='patrol';m.wait=0;m.target=null}
      }
    }else{
      const sp=K.pat+g*.4;
      if(m.wait>0){m.wait-=dt}
      else{
        if(!m.target||!m.path.length){
          if(m.target&&(m.x|0)===m.target.x&&(m.y|0)===m.target.y){m.target=null;m.wait=.8+Math.random()*1.2}
          if(!m.target&&m.wait<=0){m.target=pickPatrol(m);m.path=bfsPath(m.x|0,m.y|0,m.target.x,m.target.y)||[];if(!m.path.length){m.target=null;m.wait=.5}}
        }
        moved=followPath(m,sp,dt);
      }
    }
  }
  m.stepAcc+=moved;
  const lim=m.kind==='brute'?1.1:(m.kind==='crawler'?.6:.95);
  if(m.stepAcc>lim){
    m.stepAcc=0;
    if(md<12){
      const v=clamp(1-md/12,.04,1), pan=Math.sin(Math.atan2(m.y-posY,m.x-posX)-yaw);
      if(m.kind==='brute'){sfx.stomp(v,pan);if(md<10)kick=Math.max(kick,clamp(1-md/10,0,1)*9)}
      else if(m.kind==='crawler')sfx.skitter(v,pan);
      else if(m.kind==='statue')sfx.grind(v,pan);
      else sfx.mstep(v*.9,pan);

  }
  const lo=Math.hypot(posX-m.x,posY-m.y);
  if(lo<K.catchR&&los&&(m.kind==='statue'?!m.frozen:m.state==='chase'))caught(m);
  return clamp((K.R-lo)/K.R,0,1)*(los?1:.55);
}
function tryApparition(){
  let d=0;
  while(d<9&&!solidAt(posX+Math.cos(yaw)*d,posY+Math.sin(yaw)*d))d+=.1;
  if(d<5){apT=4;return}
  const dd=Math.min(d-.6,8);
  app={x:posX+Math.cos(yaw)*dd,y:posY+Math.sin(yaw)*dd,t:.7};
  sfx.sting();vib(80);
}
function update(dt){
  time+=dt;
  for(let i=evq.length-1;i>=0;i--){const e=evq[i];e.t-=dt;if(e.t<=0){evq.splice(i,1);e.fn()}}
  const kF=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
  const kS=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  const kT=(keys.ArrowRight||keys.KeyE?1:0)-(keys.ArrowLeft||keys.KeyQ?1:0);
  let jx=Math.abs(joyX)<.12?0:joyX, jy=Math.abs(joyY)<.12?0:joyY;
  let mf=clamp(kF-jy,-1,1), ms=clamp(kS+jx,-1,1);
  yaw+=kT*dt*2.2;
  const len=Math.hypot(mf,ms);if(len>1){mf/=len;ms/=len}
  const moving=len>.05;
  const run=(runHeld||keys.ShiftLeft||keys.ShiftRight)&&moving&&!exhausted&&stamina>0;
  movingNow=moving;runningNow=run;
  const speed=run?3.5:2.0;
  const dX=Math.cos(yaw),dY=Math.sin(yaw);
  const vx=(dX*mf-dY*ms)*speed*dt, vy=(dY*mf+dX*ms)*speed*dt;
  const ox=posX,oy=posY;
  if(!blocked(posX+vx,posY,.22))posX+=vx;
  if(!blocked(posX,posY+vy,.22))posY+=vy;
  const mv=Math.hypot(posX-ox,posY-oy);
  if(run){stamina-=26*dt;if(stamina<=0){stamina=0;exhausted=true}}
  else{stamina=Math.min(100,stamina+(moving?10:20)*dt);if(exhausted&&stamina>30)exhausted=false}
  if(moving){bobT+=dt*(run?12:8);bob=Math.sin(bobT)*(run?2.4:1.3)*(H/200)}else bob*=.9;
  stepAcc+=mv;
  if(stepAcc>(run?1.1:.85)){stepAcc=0;sfx.step(run?.35:.2,run)}
  if(flashOn&&battery>0){battery-=.9*dt;if(battery<=0){battery=0;flashOn=false;sfx.click();say('البطارية خلصت!',2.5)}}
  flickT-=dt;
  if(flickT<=0){
    flickT=.08;
    flick=(dangerS>.35&&Math.random()<dangerS*.35)?(.12+Math.random()*.3):1;
    if(battery>0&&battery<15&&Math.random()<.25)flick=Math.min(flick,.2+Math.random()*.3);
  }
  if(blackout>0)blackout-=dt;
  ambMul+=((blackout>0?.1:1)-ambMul)*Math.min(1,dt*8);
  flashMul=(flashOn&&battery>0&&blackout<=0)?flick:0;
  for(const it of items){
    if(it.taken)continue;
    if(Math.hypot(it.x-posX,it.y-posY)<.6){
      it.taken=true;
      if(it.type==='page'){
        pages++;sfx.page();say(PAGE_LINES[Math.min(pages-1,PAGE_LINES.length-1)],3.4);
        const sk=SPAWN[pages];
        if(sk)later(2.8,()=>{spawnMon(sk);sfx.spawn();say(SPAWN_MSG[sk],4,true)});
        if(pages>1&&pages<TP&&Math.random()<.45)later(1.2,()=>{blackout=2.6;sfx.blackout();sfx.sting();vib([60,40,60])});
        if(pages>=TP){
          later(1.4,()=>{sfx.clang();say('الباب اتفتح... اجري!',4)});
          for(const m of mons){if(m.kind!=='statue'){m.state='search';m.target={x:posX|0,y:posY|0};m.path=[];m.wait=0;m.repath=0}}
        }
      }else{battery=Math.min(100,battery+45);sfx.batt();say('بطارية جديدة',1.8)}
    }
  }
  const dd=Math.hypot(door.x+.5-posX,door.y+.5-posY);
  if(dd<1.3){
    if(pages>=TP){win();return}
    if(msgT<=0)say('الباب مقفول... لسه ناقصك '+(TP-pages)+' صفحات.',2.6);
  }
  let dg=0;
  for(const m of mons){
    dg=Math.max(dg,monUpdate(m,dt));
    if(state!=='playing')return;
  }
  danger=dg;
  dangerS+=(danger-dangerS)*Math.min(1,dt*3);
  if(dangerS>.12){
    heartT-=dt;
    if(heartT<=0){sfx.heart(.35+dangerS*.7);heartT=lerp(1.1,.38,dangerS);if(dangerS>.6)vib(40)}
  }
  ambT-=dt;if(ambT<=0){sfx.amb();ambT=7+Math.random()*10}
  apT-=dt;if(apT<=0){apT=28+Math.random()*35;tryApparition()}
  if(app){app.t-=dt;if(app.t<=0)app=null}
  bkT-=dt;if(bkT<=0){bkT=45+Math.random()*45;if(dangerS<.7&&blackout<=0){blackout=2.2+Math.random()*1.6;sfx.blackout();vib([60,40,60])}}
  whT-=dt;if(whT<=0){whT=22+Math.random()*25;if(msgT<=0)say(WHISPERS[(Math.random()*WHISPERS.length)|0],2.6,true)}
  if(AC&&droneGain){
    droneGain.gain.setTargetAtTime(.06+dangerS*.08,AC.currentTime,.3);
    tenGain.gain.setTargetAtTime(dangerS*dangerS*.045,AC.currentTime,.2);
  }
  kick*=Math.pow(.03,dt);
  shakeY=(Math.random()-.5)*(dangerS*dangerS*3+kick)*(H/200);
  msgT-=dt;if(msgT<=0)msgEl.style.opacity=0;
  pgEl.textContent=pages+'/'+TP;
  batEl.style.width=battery+'%';batBar.classList.toggle('low',battery<20);
  stmEl.style.width=stamina+'%';
}
function updateCaught(dt){
  caughtT+=dt;
  shakeY=(Math.random()-.5)*10;
  const m=catcher||mons[0];
  const ang=Math.atan2(m.y-posY,m.x-posX);let df=ang-yaw;while(df>Math.PI)df-=2*Math.PI;while(df<-Math.PI)df+=2*Math.PI;
  yaw+=df*Math.min(1,dt*10);
  flashMul=Math.random()<.5?1:.1;
  const w=innerWidth,h=innerHeight;
  if(scv.width!==w||scv.height!==h){scv.width=w;scv.height=h}
  sctx.fillStyle=Math.random()<.12?'#fff':'#000';sctx.fillRect(0,0,w,h);
  const dh=h*(.75+Math.min(caughtT,1.5)*.3);
  const sx=(Math.random()-.5)*14,sy=(Math.random()-.5)*14;
  const hg=sctx.createRadialGradient(w/2,h/2,dh*.1,w/2,h/2,dh*.62);hg.addColorStop(0,'rgba(120,125,150,.55)');hg.addColorStop(1,'rgba(0,0,0,0)');sctx.fillStyle=hg;sctx.fillRect(0,0,w,h);
  sctx.imageSmoothingEnabled=true;
  sctx.drawImage(SCARE[m.kind],w/2-dh/2+sx,h/2-dh/2+sy,dh,dh);
  if(Math.random()<.25){sctx.fillStyle='rgba(255,0,0,.35)';sctx.fillRect(0,0,w,h)}
  if(caughtT>1.8)endDead();
}

/* ============ render ============ */
function resize(){
  const aw=innerWidth||800,ah=innerHeight||450,asp=aw/ah;
  W=Math.max(120,Math.round(Math.sqrt(budget*asp)));H=Math.max(80,Math.round(W/asp));
  cv.width=W;cv.height=H;img=cctx.createImageData(W,H);buf8=img.data;
  for(let i=3;i<buf8.length;i+=4)buf8[i]=255;
  F=(W/2)/PL;zbuf=new Float32Array(W);
  cone=new Float32Array(W*H);vig=new Float32Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const dx=(x+.5-W/2)/F,dy=(y+.5-H*.54)/F,a=Math.sqrt(dx*dx+dy*dy);
    const t=smooth(0,1,1-a/.62);cone[y*W+x]=Math.pow(t,1.25);
    const nx=(x/W)*2-1,ny=(y/H)*2-1;
    vig[y*W+x]=1-.78*smooth(.5,1.3,Math.sqrt(nx*nx+ny*ny));
  }
  scv.width=aw;scv.height=ah;
}
function drawSprite(s,fm){
  const rx=s.x-posX,ry=s.y-posY,a=rx*dirX+ry*dirY;
  if(a<.12)return;
  const b=(dirX*ry-dirY*rx)/PL, sxs=(W/2)*(1+b/a);
  const hpx=F*s.scale/a, wpx=hpx*s.tex.w/s.tex.h;
  const bottom=cy+F*(.5-s.z)/a, top=bottom-hpx;
  const x0=Math.floor(sxs-wpx/2), x1=Math.floor(sxs+wpx/2);
  const y0=Math.max(0,Math.floor(top)), y1=Math.min(H-1,Math.floor(bottom));
  if(x1<0||x0>=W||y1<y0)return;
  const Lf=fm/(1+.1*a*a), La=amb(a), tw=s.tex.w, th=s.tex.h, td=s.tex.d, gl=s.glow, xe=Math.min(W-1,x1);
  for(let x=Math.max(0,x0);x<=xe;x++){
    if(a>=zbuf[x])continue;
    const u=Math.min(tw-1,((x-x0)/(x1-x0+1)*tw)|0);
    for(let y=y0;y<=y1;y++){
      const v=Math.min(th-1,Math.max(0,((y-top)/hpx*th)|0)), ti=(v*tw+u)*4, al=td[ti+3];
      if(al<24)continue;
      const r=td[ti],g=td[ti+1],bl=td[ti+2], p=(y*W+x)*4;
      let lr,lg,lb;
      if(r>215&&g<80&&bl<80){lr=lg=lb=1}
      else if(s.emis&&r+g+bl>380){lr=lg=lb=.85}
      else{const lf=Lf*cone[y*W+x];lr=lf+La*.55+gl;lg=lf*.93+La*.72+gl;lb=lf*.78+La+gl}
      const aa=al/255,ia=1-aa;
      buf8[p]=buf8[p]*ia+r*lr*aa;buf8[p+1]=buf8[p+1]*ia+g*lg*aa;buf8[p+2]=buf8[p+2]*ia+bl*lb*aa;
    }
  }
}
function render(){
  cy=H*.5+bob+shakeY;
  const dX=Math.cos(yaw),dY=Math.sin(yaw);dirX=dX;dirY=dY;planeX=-dY*PL;planeY=dX*PL;
  const fm=flashMul*FK, floorT=TEX.floor, ceilT=TEX.ceil;
  for(let y=0;y<H;y++){
    const p=y+.5-cy;
    let o=y*W,p4=o*4;
    if(p>-.6&&p<.6){for(let x=0;x<W;x++){buf8[p4]=buf8[p4+1]=buf8[p4+2]=0;p4+=4}continue}
    const rd=F*.5/Math.abs(p), Lf=fm/(1+.1*rd*rd), La=amb(rd), tex=p>0?floorT:ceilT;
    const stX=rd*2*planeX/W, stY=rd*2*planeY/W;
    let fx=posX+rd*(dX-planeX), fy=posY+rd*(dY-planeY);
    const ra=La*.55,ga=La*.72,ba=La;
    for(let x=0;x<W;x++){
      const tx=((fx*T)|0)&TM, ty=((fy*T)|0)&TM, ti=((ty<<6)+tx)*3, lf=Lf*cone[o+x];
      buf8[p4]=tex[ti]*(lf+ra);buf8[p4+1]=tex[ti+1]*(lf*.93+ga);buf8[p4+2]=tex[ti+2]*(lf*.78+ba);
      p4+=4;fx+=stX;fy+=stY;
    }
  }
  const unlocked=pages>=TP;
  for(let x=0;x<W;x++){
    const cxn=2*x/W-1, rdx=dX+planeX*cxn, rdy=dY+planeY*cxn;
    let mx=posX|0,my=posY|0;
    const ddx=rdx===0?1e30:Math.abs(1/rdx), ddy=rdy===0?1e30:Math.abs(1/rdy);
    let stepX,stepY,sdx,sdy;
    if(rdx<0){stepX=-1;sdx=(posX-mx)*ddx}else{stepX=1;sdx=(mx+1-posX)*ddx}
    if(rdy<0){stepY=-1;sdy=(posY-my)*ddy}else{stepY=1;sdy=(my+1-posY)*ddy}
    let side=0,type=1;
    for(;;){
      if(sdx<sdy){sdx+=ddx;mx+=stepX;side=0}else{sdy+=ddy;my+=stepY;side=1}
      if(mx<0||my<0||mx>=MW||my>=MH){type=1;break}
      const c=map[my*MW+mx];if(c){type=c;break}
    }
    let perp=side===0?sdx-ddx:sdy-ddy;if(perp<.05)perp=.05;
    zbuf[x]=perp;
    let wx=side===0?posY+perp*rdy:posX+perp*rdx;wx-=Math.floor(wx);
    let texX=(wx*T)|0;
    if(side===0&&rdx>0)texX=T-1-texX;
    if(side===1&&rdy<0)texX=T-1-texX;
    const lineH=F/perp, yt=cy-lineH*.5, yb=cy+lineH*.5;
    const ys=Math.max(0,Math.floor(yt)), ye=Math.min(H-1,Math.floor(yb));
    const stp=T/lineH;let tp=(ys-yt)*stp;
    const tex=WALLTEX[type]||TEX.wall;
    const Lf=fm/(1+.1*perp*perp), La=amb(perp), sh=side?.8:1, ra=La*.55,ga=La*.72;
    const isDoor=type===2;
    for(let y=ys;y<=ye;y++){
      let ty=tp|0;if(ty>TM)ty=TM;if(ty<0)ty=0;tp+=stp;
      const k=(ty<<6)+texX, ti=k*3, p4=(y*W+x)*4;
      if(isDoor&&doorLamp[k]){
        if(unlocked){buf8[p4]=40;buf8[p4+1]=230;buf8[p4+2]=90}
        else{const pu=.7+.3*Math.sin(time*3);buf8[p4]=210*pu;buf8[p4+1]=25*pu;buf8[p4+2]=20*pu}
        continue;
      }
      const lf=Lf*cone[y*W+x];
      buf8[p4]=tex[ti]*(lf+ra)*sh;buf8[p4+1]=tex[ti+1]*(lf*.93+ga)*sh;buf8[p4+2]=tex[ti+2]*(lf*.78+La)*sh;
    }
  }
  const list=[];
  for(const it of items){
    if(it.taken)continue;
    const isP=it.type==='page';
    list.push({x:it.x,y:it.y,z:(isP?.22+.05*Math.sin(time*2+it.ph):.02),scale:isP?.38:.3,tex:isP?SPR.page:SPR.batt,glow:isP?.3:.2,d:(it.x-posX)*(it.x-posX)+(it.y-posY)*(it.y-posY)});
  }
  for(const m of mons){
    list.push({x:m.x,y:m.y,z:0,scale:KIND[m.kind].scale,tex:SPR[m.kind],glow:0,emis:m.kind==='stalker',d:(m.x-posX)*(m.x-posX)+(m.y-posY)*(m.y-posY)});
  }
  if(app)list.push({x:app.x,y:app.y,z:0,scale:KIND.stalker.scale,tex:SPR.stalker,glow:.3,emis:true,d:(app.x-posX)*(app.x-posX)+(app.y-posY)*(app.y-posY)});
  list.sort((a,b)=>b.d-a.d);
  for(const s of list)drawSprite(s,fm);
  const N=W*H, go=(Math.random()*4096)|0, ga2=5+dangerS*dangerS*38+(state==='caught'?30:0), rt=dangerS*dangerS*22;
  for(let i=0,p=0;i<N;i++,p+=4){
    const v=vig[i], n=(grain[(i+go)&4095]-.5)*ga2;
    buf8[p]=buf8[p]*v+n+rt*v;buf8[p+1]=buf8[p+1]*v+n;buf8[p+2]=buf8[p+2]*v+n;
  }
  if(dangerS>.45||state==='caught'){
    const n=state==='caught'?10:((dangerS*6)|0);
    for(let k=0;k<n;k++){
      const y=(Math.random()*H)|0, s=((Math.random()-.5)*W*.14)|0;
      if(!s)continue;
      const a=y*W*4, e=a+W*4;
      if(s>0)buf8.copyWithin(a+s*4,a,e-s*4);else buf8.copyWithin(a,a-s*4,e);
    }
  }
  cctx.putImageData(img,0,0);
}

/* ============ loop ============ */
let last=0,fpsAcc=0,fpsN=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;
  if(state==='paused')return;
  if(state==='playing')update(dt);
  else if(state==='caught')updateCaught(dt);
  else if(state==='menu'){yaw+=dt*.12;flashMul=1;bob=0;shakeY=0}
  render();
  fpsAcc+=dt;fpsN++;
  if(fpsAcc>1.6){
    const fps=fpsN/fpsAcc;fpsAcc=0;fpsN=0;
    if(fps<38&&budget>28000){budget=Math.round(budget*.75);resize()}
  }
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,250));
resize();newGame();showScreen('menu');
requestAnimationFrame(frame);
})();
</script>

<script>
/* Extra dread layer: original in-file monster image remains untouched. */
(()=>{
 const whisper=document.getElementById('fearWhisper');
 const lines=['ماتلفش ضهرك...','هو واقف وراك','سمعت النفس؟','الكشاف مش هيحميك','اقرب... اقرب...','ماتجريش... هو سامعك','بص في آخر الممر'];
 let timer=0, next=9+Math.random()*9, active=0, audioCtx=null, enabled=false;
 function playing(){return document.getElementById('hud')?.style.display!=='none' && !document.getElementById('scr')?.classList.contains('show')}
 function scare(){
   if(!playing())return;
   document.body.classList.add('fear-shake','fear-red');
   whisper.textContent=lines[(Math.random()*lines.length)|0];whisper.style.opacity='1';
   // A short low heartbeat-like thump, generated locally; no downloaded audio.
   try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();
     const t=audioCtx.currentTime;[0,.23].forEach((d,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(i?48:62,t+d);o.frequency.exponentialRampToValueAtTime(28,t+d+.16);g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.22,t+d+.025);g.gain.exponentialRampToValueAtTime(.0001,t+d+.19);o.connect(g);g.connect(audioCtx.destination);o.start(t+d);o.stop(t+d+.2)});
   }catch(e){}
   setTimeout(()=>{document.body.classList.remove('fear-shake','fear-red');whisper.style.opacity='0'},650);
   next=10+Math.random()*17;
 }
 let last=performance.now();function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing()){timer+=dt;if(timer>next){timer=0;scare()}}else{timer=0}requestAnimationFrame(tick)}
 // The first interaction unlocks browser audio on mobile.
 addEventListener('pointerdown',()=>{try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}},{once:true,passive:true});
 requestAnimationFrame(tick);
})();
</script>
